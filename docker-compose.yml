services:
  # ---- Nginx Web Server ----
  portfolio-web:
    image: nginx:alpine
    container_name: portfolio-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src:/usr/share/nginx/html:ro
      - ./uploads:/usr/share/nginx/uploads:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      portfolio-api:
        condition: service_healthy
    networks:
      - portfolio-net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ---- Node.js API Server ----
  portfolio-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: portfolio-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    volumes:
      - ./src/data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - portfolio-net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ---- Restricted PHP Sandbox Container ----
  portfolio-php-sandbox:
    build:
      context: ./docker/php-sandbox
      dockerfile: Dockerfile
    container_name: portfolio-php-sandbox
    restart: unless-stopped
    volumes:
      - ./uploads/assignments:/var/www/uploads/assignments:ro
    networks:
      - portfolio-net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

networks:
  portfolio-net:
    driver: bridge
