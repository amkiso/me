<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Quản trị nội dung</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif'],mono:['JetBrains Mono','monospace']}}}}</script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="icon" href="avt.png">
</head>
<body>
  <!-- NAV -->
  <nav class="nav-bar fixed top-0 left-0 right-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <img src="avt.png" alt="Lô Hoàng Vũ" class="w-8 h-8 rounded-full object-cover shadow-md border border-sky-500/30">
        <span class="text-base font-bold text-primary">Quản trị</span>
      </div>
      <div class="flex items-center gap-2">
        <span id="admin-user" class="text-xs text-muted hidden sm:block"></span>
        <a href="/" class="text-xs text-muted hover:text-sky-500 transition-colors">Xem trang</a>
        <button id="btn-logout" class="text-xs text-red-400 hover:text-red-300 transition-colors ml-2">Đăng xuất</button>
      </div>
    </div>
  </nav>

  <main class="pt-20 pb-16">
    <div class="max-w-6xl mx-auto px-4 sm:px-6">
      <!-- Header -->
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold text-primary">Quản lý Môn học</h1>
          <p class="text-muted text-xs mt-1">Thêm, sửa, xóa môn học và bài tập</p>
        </div>
        <button id="btn-add-subject" class="btn-primary px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Thêm môn học
        </button>
      </div>

      <!-- Subject List -->
      <div id="admin-subjects" class="space-y-4">
        <div class="text-center py-12 text-muted text-sm">Đang tải...</div>
      </div>
    </div>
  </main>

  <!-- Modal: Add/Edit Subject -->
  <div id="modal-subject" class="fixed inset-0 z-50 hidden items-center justify-center p-4" style="background:rgba(0,0,0,0.5)">
    <div class="card p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <h2 id="modal-title" class="text-lg font-bold text-primary">Thêm môn học</h2>
        <button id="modal-close" class="text-muted hover:text-primary transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="form-subject" class="space-y-3">
        <input type="hidden" id="f-editing-id">
        <div>
          <label class="block text-xs font-medium text-secondary mb-1">ID (slug) *</label>
          <input type="text" id="f-id" required placeholder="web-php" class="input-field w-full px-3 py-2 rounded-lg text-sm outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-secondary mb-1">Tên môn học *</label>
          <input type="text" id="f-name" required placeholder="Lập trình Web PHP" class="input-field w-full px-3 py-2 rounded-lg text-sm outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-secondary mb-1">Học kỳ</label>
            <input type="text" id="f-semester" placeholder="HK1 - Năm 3" class="input-field w-full px-3 py-2 rounded-lg text-sm outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-secondary mb-1">Màu gradient</label>
            <select id="f-color" class="input-field w-full px-3 py-2 rounded-lg text-sm outline-none">
              <option value="from-sky-500 to-blue-600">Sky Blue</option>
              <option value="from-emerald-500 to-teal-600">Emerald</option>
              <option value="from-orange-500 to-amber-600">Orange</option>
              <option value="from-cyan-500 to-sky-600">Cyan</option>
              <option value="from-rose-500 to-red-600">Rose</option>
              <option value="from-blue-500 to-blue-700">Blue</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-secondary mb-1">Mô tả</label>
          <textarea id="f-desc" rows="2" placeholder="Mô tả ngắn..." class="input-field w-full px-3 py-2 rounded-lg text-sm outline-none resize-none"></textarea>
        </div>

        <!-- Assignments -->
        <div class="pt-2 border-t border-subtle">
          <div class="flex items-center justify-between mb-2">
            <label class="text-xs font-medium text-secondary">Bài tập / Labs</label>
            <button type="button" id="btn-add-assignment" class="text-xs text-sky-500 hover:text-sky-400 font-medium">+ Thêm bài tập</button>
          </div>
          <div id="assignments-list" class="space-y-2"></div>
        </div>

        <div class="flex gap-2 pt-3">
          <button type="submit" class="btn-primary flex-1 px-4 py-2 rounded-lg text-sm font-medium">Lưu</button>
          <button type="button" id="btn-cancel" class="btn-outline flex-1 px-4 py-2 rounded-lg text-sm font-medium">Hủy</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Confirm Delete -->
  <div id="modal-delete" class="fixed inset-0 z-50 hidden items-center justify-center p-4" style="background:rgba(0,0,0,0.5)">
    <div class="card p-6 w-full max-w-sm text-center">
      <svg class="w-10 h-10 mx-auto mb-3 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
      <h3 class="text-base font-bold text-primary mb-1">Xác nhận xóa</h3>
      <p id="delete-msg" class="text-muted text-sm mb-4"></p>
      <div class="flex gap-2">
        <button id="btn-confirm-delete" class="flex-1 px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg text-sm font-medium transition-colors">Xóa</button>
        <button id="btn-cancel-delete" class="btn-outline flex-1 px-4 py-2 rounded-lg text-sm font-medium">Hủy</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/admin.js"></script>
</body>
</html>
