name: Deploy Portfolio & CMS to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout mã nguồn từ repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Đóng gói mã nguồn (loại bỏ thư mục .git, uploads và src/data để không ghi đè dữ liệu trên server)
      - name: Create archive
        run: |
          tar -czf ../deploy.tar.gz --exclude='.git' --exclude='uploads' --exclude='src/data' .
          mv ../deploy.tar.gz .

      # Bước 3: Gửi file đóng gói lên máy chủ EC2
      - name: Copy archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: "deploy.tar.gz"
          target: "~/my-portfolio"

      # Bước 4: Kết nối SSH để giải nén và khởi động lại Docker
      - name: SSH Remote Commands to Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            # 1. Di chuyển vào thư mục dự án
            cd ~/my-portfolio

            # 2. Giải nén mã nguồn mới và xóa file nén
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            # 3. Build lại Docker images và khởi động các container ở chế độ background
            docker compose up -d --build

            # 4. Dọn dẹp các Docker image rác
            docker image prune -f
