name: Deploy Portfolio & CMS to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout mã nguồn từ repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Đóng gói mã nguồn (loại bỏ .git, uploads, src/data, api/.env)
      - name: Create archive
<<<<<<< HEAD
        run: tar -czf deploy.tar.gz --exclude='.git' --exclude='deploy.tar.gz' --exclude='uploads' --exclude='src/data' --exclude='api/.env' .

      # Bước 3: Gửi file đóng gói lên máy chủ EC2
      - name: Copy archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: "deploy.tar.gz"
          target: "~/my-portfolio"

      # Bước 4: Kết nối SSH để giải nén và khởi động lại Docker
      - name: SSH Remote Commands to Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            cd ~/my-portfolio

            # 1. Backup dữ liệu quan trọng trước khi giải nén
            echo "==> Backing up server data..."
            mkdir -p /tmp/portfolio-backup
            [ -d src/data ] && cp -r src/data /tmp/portfolio-backup/ || true
            [ -d uploads ] && cp -r uploads /tmp/portfolio-backup/ || true
            [ -f api/.env ] && cp api/.env /tmp/portfolio-backup/ || true

            # 2. Giải nén mã nguồn mới
            echo "==> Extracting new code..."
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            # 3. Khôi phục dữ liệu đã backup
            echo "==> Restoring server data..."
            [ -d /tmp/portfolio-backup/data ] && cp -r /tmp/portfolio-backup/data src/ || true
            [ -d /tmp/portfolio-backup/uploads ] && cp -r /tmp/portfolio-backup/uploads ./ || true
            [ -f /tmp/portfolio-backup/.env ] && cp /tmp/portfolio-backup/.env api/ || true
            rm -rf /tmp/portfolio-backup

            # 4. Build lại Docker images và khởi động containers
            echo "==> Building and starting Docker containers..."
            docker compose up -d --build

            # 5. Dọn dẹp Docker image rác
            docker image prune -f

            echo "==> Deploy completed successfully!"
