; PHP Sandbox Security Configuration
disable_functions = exec, passthru, shell_exec, system, proc_open, popen, curl_exec, parse_ini_file, show_source, phpinfo, pcntl_exec, assert
open_basedir = /var/www/uploads/assignments/
allow_url_fopen = Off
allow_url_include = Off
memory_limit = 64M
max_execution_time = 5
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
