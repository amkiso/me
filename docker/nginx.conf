# Nginx Configuration - Portfolio & CMS
# Reverse proxy to API + static file serving for hoangvux.me

upstream api_backend {
    server portfolio-api:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name hoangvux.me www.hoangvux.me localhost;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API Proxy
    location /api/ {
        proxy_pass http://api_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Uploads Static Directory
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # PHP Sandbox Preview (PHP Files)
    location ~ ^/preview/([^/]+)/([^/]+)/(.*\.php)$ {
        fastcgi_pass portfolio-php-sandbox:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/uploads/assignments/$1/$2/$3;
        fastcgi_param SCRIPT_NAME /preview/$1/$2/$3;
    }

    # PHP Sandbox Preview (Static Files: CSS, JS, Images, Docx)
    location ~ ^/preview/([^/]+)/([^/]+)/(.*)$ {
        alias /usr/share/nginx/uploads/assignments/$1/$2/$3;
    }

    # Admin Area
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Static CSS, JS - Cache 7 days
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images, Fonts - Cache 30 days
    location ~* \.(ico|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # JSON - no cache for live reload
    location ~* \.json$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Main Router
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Deny hidden files
    location ~ /\. { deny all; access_log off; log_not_found off; }
    location = /favicon.ico { log_not_found off; access_log off; }
}
